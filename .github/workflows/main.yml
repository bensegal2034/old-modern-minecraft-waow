name: "Zip repo and upload to releases on commit to main"

on: [push]

jobs:
  zip-repo:
    name: "Zip latest commit"
    runs-on: "ubuntu-latest"

    steps:
      - uses: actions/checkout@master
        with:
          path: repo

      - uses: thedoctor0/zip-release@0.7.5
        with:
          type: "zip"
          filename: "zipfile/release.zip"
          directory: "${{ github.workspace }}"
          path: "${{ github.workspace }}/repo"
          command: "mkdir -p zipfile"
          exclusions: "*.git* *.github*"

  create-release:
    name: "Create release"
    runs-on: "ubuntu-latest"
    needs: zip-repo
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v3
      - uses: "ncipollo/release-action@v1"
        with:
          tag: "Latest"
          name: "Current Build"
          artifacts: "${{ github.workspace }}/zipfile/release.zip"