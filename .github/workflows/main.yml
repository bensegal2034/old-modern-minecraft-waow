name: "Zip repo and upload to releases on commit to main"

on: [push]

jobs:
  zip-repo:
    name: "Zip latest commit"
    runs-on: "ubuntu-latest"

    steps:
      - uses: actions/checkout@master
      - uses: thedoctor0/zip-release@0.7.5
        with:
          type: "zip"
          filename: "release.zip"

  create-release:
    name: "Create release"
    runs-on: "ubuntu-latest"
    needs: zip-repo

    steps:
      - uses: "marvinpinto/action-automatic-releases@latest"
        with:
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          prerelease: false
          automatic_release_tag: "Latest"
          title: "Current Build"
          files: |
            release.zip