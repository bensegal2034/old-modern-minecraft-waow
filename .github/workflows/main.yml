name: "create-release"

on:
  push:
    branches:
      - "main"

jobs:
  create-release:
    name: "Create release"
    runs-on: "ubuntu-latest"

    steps:
      - uses: actions/checkout@master
      - name: "Zip repository"
        uses: thedoctor0/zip-release@0.7.5
        with:
          type: 'zip'
          filename: 'release.zip'
          exclusions: '*.git*'
          
      - name: Upload Release
      - uses: ncipollo/release-action@v1.12.0
        with:
          artifacts: "release.zip"
          token: ${{ secrets.GITHUB_TOKEN }}
