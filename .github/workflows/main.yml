name: "create-release"

on:
  push:
    branches:
      - "main"

jobs:
  upload-release:
    name: "Upload release"
    runs-on: "ubuntu-latest"
    permissions:
      contents: write
    
    steps:
      - uses: ncipollo/release-action@v1.12.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: "Release ${{ github.ref }}"
          commit: "main"
          removeArtifacts: true
          replacesArtifacts: true