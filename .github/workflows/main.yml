name: "Zip repo and upload to releases on commit to main"

on:
  push:
    branches:
      - "main"

jobs:
  zip-repo:
    name: "Zip latest commit"
    runs-on: "ubuntu-latest"

    steps:
      - uses: "TheDoctor0/zip-release@0.7.6"
        with:
          type: "zip"
          filename: "release.zip"
          exclusions: "*.git* *.github*"

  create-release:
    name: "Create release"
    runs-on: "ubuntu-latest"
    needs: zip-repo

    steps:
      - uses: "marvinpinto/action-automatic-releases@latest"
        with:
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          prerelease: false
          automatic_release_tag: "Latest"
          title: "Current Build"
          files: |
            *.zip