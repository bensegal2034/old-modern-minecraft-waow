name: "create-release"

on:
  push:
    branches:
      - "main"

jobs:
  build:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: Latest
          release_name: Release ${{ github.sha }}
          draft: false
          prerelease: false

name: "create-release"

on:
  push:
    branches:
      - "main"

jobs:
  upload-release:
    name: "Upload release"
    runs-on: "ubuntu-latest"
    
    steps:
      - uses: ncipollo/release-action@v1.12.0
        with:
          tag: "Latest"
          commit: "main"
          token: ${{ secrets.GITHUB_TOKEN }}
          allowUpdates: true