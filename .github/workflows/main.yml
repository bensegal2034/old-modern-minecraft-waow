name: "create-release"

on:
  push:
    branches:
      - "main"

jobs:
  zip-repository:
    name: "Zip repository"
    runs-on: "ubuntu-latest"

    steps:
      - uses: actions/checkout@master
        uses: thedoctor0/zip-release@0.7.5
        with:
          type: 'zip'
          filename: 'release.zip'
          exclusions: '*.git*'
  
  upload-release:
    name: "Upload release"
    needs: zip-repository
    build:
      runs-on: ubuntu-latest
      permissions:
        contents: write
      steps:
      - uses: actions/checkout@v3
      - uses: ncipollo/release-action@v1
        with:
          artifacts: "release.zip"